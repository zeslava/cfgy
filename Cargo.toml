[package]
name = "cfgy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cfgy"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "sync", "time", "signal", "fs", "io-util", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Crypto
ring = "0.17"
argon2 = "0.5"
password-hash = "0.5"
aes-gcm = { version = "0.10", features = ["aes", "rand_core"] }
hex = "0.4"
base64 = "0.22"

# JWT
jsonwebtoken = "9.3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2.1"

# Async traits
async-trait = "0.1"

# File formats
serde_yaml = "0.9"

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# Chrono
chrono = { version = "0.4", features = ["serde"] }

# Environment variables
dotenv = "0.15"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1.10", features = ["v4"] }
