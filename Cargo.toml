[workspace]
members = ["server", "cli", "tests"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Async runtime (минимальный набор вместо "full" — быстрее сборка, меньше бинарь)
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "sync", "time", "signal", "fs", "io-util", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
