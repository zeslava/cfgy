# https://taskfile.dev
version: "3"

dotenv: [".env"]

tasks:
  default:
    desc: Показать справку по командам
    cmds:
      - task --list

  build:
    desc: Собрать cfgy-server (release)
    cmds:
      - cargo build --release --bin cfgy-server

  cli:
    deps:
      - build-cli
    cmd: ./target/release/cfgy-cli

  build-cli:
    desc: Собрать cfgy CLI (release)
    cmds:
      - cargo build --release -p cfgy-cli

  install-cli:
    desc: "Установить cfgy CLI в /usr/local/bin (запускать с sudo: sudo task install-cli)"
    deps: [build-cli]
    cmds:
      - sudo install -m 755 target/release/cfgy-cli /usr/local/bin/cfgy
      - 'echo "Установлено: /usr/local/bin/cfgy"'

  uninstall-cli:
    desc: "Удалить cfgy CLI из /usr/local/bin (запускать с sudo: sudo task uninstall-cli)"
    cmds:
      - sudo rm -f /usr/local/bin/cfgy
      - 'echo "Удалено: /usr/local/bin/cfgy"'

  run:
    desc: "Запустить сервер локально (БД отдельно: task up или свой инстанс)"
    deps: [build, migrate]
    cmds:
      - echo "Сервер на http://localhost:8080"
      - ./target/release/cfgy-server

  build-web:
    desc: Собрать веб в релиз (web/build)
    dir: web
    cmds:
      - npm run build

  web:
    desc: Запустить веб (Svelte) dev сервер
    dir: web
    cmds:
      - echo "Веб на http://localhost:5173, API на http://localhost:8080"
      - npm run dev

  up:
    desc: Запустить PostgreSQL в Docker
    cmds:
      - docker compose up -d postgres
      - task: wait-postgres

  down:
    desc: Остановить контейнеры
    cmds:
      - docker compose down

  migrate:
    desc: Применить миграции
    dir: server
    cmds:
      - sqlx migrate run --database-url "$DATABASE_URL"
    ignore_error: true

  generate-secrets:
    desc: Сгенерировать CFGY_MASTER_KEY и CFGY_JWT_SECRET (через cfgy generate-secrets)
    cmds:
      - cargo run -p cfgy-cli --release -- generate-secrets --format env

  wait-postgres:
    internal: true
    cmds:
      - |
        for i in $(seq 1 60); do
          if docker compose exec -T postgres pg_isready -U postgres > /dev/null 2>&1; then
            echo "PostgreSQL готов!"
            exit 0
          fi
          sleep 1
        done

  install-freebsd:
    desc: Установить cfgy-server как системный сервис на FreeBSD (запускать от root на целевом хосте)
    cmds:
      - ./freebsd/install.sh target/release/cfgy-server
