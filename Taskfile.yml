# https://taskfile.dev
version: "3"

dotenv: [".env"]

tasks:
  default:
    desc: Показать справку по командам
    cmds:
      - task --list

  build:
    desc: Собрать cfgy (release, со встроенным веб-дашбордом)
    deps: [build-web]
    cmds:
      - cargo build --release

  install:
    desc: "Установить cfgy в /usr/local/bin (запускать с sudo: sudo task install)"
    deps: [build]
    cmds:
      - sudo install -m 755 target/release/cfgy /usr/local/bin/cfgy
      - 'echo "Установлено: /usr/local/bin/cfgy"'

  uninstall:
    desc: "Удалить cfgy из /usr/local/bin (запускать с sudo: sudo task uninstall)"
    cmds:
      - sudo rm -f /usr/local/bin/cfgy
      - 'echo "Удалено: /usr/local/bin/cfgy"'

  run:
    desc: "Запустить сервер локально (БД отдельно: task up или свой инстанс)"
    deps: [build, migrate]
    cmds:
      - echo "Сервер на http://localhost:8080"
      - ./target/release/cfgy serve

  build-web:
    desc: Собрать веб в релиз (web/build)
    dir: web
    cmds:
      - npm run build

  web:
    desc: Запустить веб (Svelte) dev сервер
    dir: web
    cmds:
      - echo "Веб на http://localhost:5173, API на http://localhost:8080"
      - npm run dev

  up:
    desc: Запустить PostgreSQL в Docker
    cmds:
      - docker compose up -d postgres
      - task: wait-postgres

  down:
    desc: Остановить контейнеры
    cmds:
      - docker compose down

  migrate:
    desc: Применить миграции
    cmds:
      - sqlx migrate run --database-url "$DATABASE_URL"
    ignore_error: true

  generate-secrets:
    desc: Сгенерировать CFGY_MASTER_KEY и CFGY_JWT_SECRET
    cmds:
      - cargo run --release -- generate-secrets --format env

  wait-postgres:
    internal: true
    cmds:
      - |
        for i in $(seq 1 60); do
          if docker compose exec -T postgres pg_isready -U postgres > /dev/null 2>&1; then
            echo "PostgreSQL готов!"
            exit 0
          fi
          sleep 1
        done

  e2e:
    desc: Запустить e2e тесты (поднимает сервер, прогоняет тесты, останавливает)
    deps: [build, migrate]
    cmds:
      - bash scripts/run-e2e.sh

  install-freebsd:
    desc: Установить cfgy как системный сервис на FreeBSD (запускать от root на целевом хосте)
    cmds:
      - doas ./freebsd/install.sh target/release/cfgy

  dail:
    desc: Собрать и запустить cfgy в dail jail
    deps: [build, build-web]
    cmds:
      - doas dail run cfgy.dail
