[package]
name = "cfgy-server"
version.workspace = true
edition.workspace = true

[dependencies]
# Workspace dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Web framework (без "trace" — меньше кода в бинарнике)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
] }

# Crypto
ring = "0.17"
argon2 = "0.5"
password-hash = "0.5"
aes-gcm = { version = "0.10", features = ["aes", "rand_core"] }
hex = "0.4"

# JWT
jsonwebtoken = "9.3"

# Chrono for timestamps
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Async traits
async-trait = "0.1"

# ZID OAuth 2.0 integration (default-features = false — меньше зависимостей)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2.1"
base64 = "0.22"
